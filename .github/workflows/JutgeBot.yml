name: 🤖 JutgeBot: AC Hunter (PRO1)

on:
  push:
    paths:
      - 'PRO1/**'

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar el codi del repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install jutge-api-client || echo "Si dona error, assegura't que el mòdul s'instal·la via pip"

      - name: 🚀 Detectar fitxers i enviar al Jutge
        env:
          JUTGE_EMAIL: ${{ secrets.JUTGE_EMAIL }}
          JUTGE_PASSWORD: ${{ secrets.JUTGE_PASSWORD }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^PRO1/' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No s'han detectat canvis a la carpeta PRO1."
            exit 0
          fi

          for FILEPATH in $CHANGED_FILES; do
            if [[ "$FILEPATH" == *.cpp ]]; then
              FILENAME=$(basename "$FILEPATH")
              PROBLEM_ID="${FILENAME%.*}"
              echo "--------------------------------------------------"
              echo "Processing: $FILEPATH (Problem ID: ${PROBLEM_ID}_ca)"
              echo "--------------------------------------------------"
              cat << 'EOF' > run_submit.py
import os
import sys
import time
from datetime import datetime
from jutge_api_client import JutgeApiClient

if len(sys.argv) < 3:
    print("Error: Falten arguments.")
    sys.exit(1)

filepath = sys.argv[1]
problem_id = sys.argv[2] + "_ca"

jutge = JutgeApiClient()
email = os.environ.get("JUTGE_EMAIL")
password = os.environ.get("JUTGE_PASSWORD")

if not email or not password:
    print("Error: No s'han trobat les credencials als Secrets de GitHub.")
    sys.exit(1)

jutge.login(email, password)

with open(filepath, "r") as file:
    nowDate = datetime.today().strftime("%d/%m/%Y")
    nowTime = datetime.today().strftime("%H:%M:%S")
    submitted_data = {
        "compiler_id": "P1++",
        "problem_id": problem_id,
        "annotation": f"Sent through JutgeBot (GitHub Actions) on {nowDate} at {nowTime}",
    }

    submission = jutge.student.submissions.submit(submitted_data, file)

print(f"Submission sent! ID: {submission.submission_id}. Waiting for verdict...")

veredict = None
while veredict is None:
    time.sleep(2)
    state = jutge.student.submissions.get(problem_id, submission.submission_id)
    if state.state == "done":
        veredict = state.veredict

print(f"» Verdict for {problem_id}: {veredict}")

if veredict != "AC":
    print(f"❌ Failed with verdict: {veredict}")
    sys.exit(1)
else:
    print("✅ Success! Accepted!")
EOF
              python run_submit.py "$FILEPATH" "$PROBLEM_ID"
            fi
          done


name: JutgeBot - PRO1

on:
  push:
    paths:
      - '1r/Q1/PRO1/ejercicios/**'

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: enviar al jutge
        env:
          JUTGE_EMAIL: ${{ secrets.JUTGE_EMAIL }}
          JUTGE_PASSWORD: ${{ secrets.JUTGE_PASSWORD }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^1r/Q1/PRO1/ejercicios/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "res a fer, no hi ha canvis a PRO1"
            exit 0
          fi

          for FILEPATH in $CHANGED_FILES; do
            if [[ "$FILEPATH" == *.cpp ]]; then
              FILENAME=$(basename "$FILEPATH")
              PROBLEM_ID="${FILENAME%.*}"

              echo "enviant $FILEPATH -> ${PROBLEM_ID}_ca"

              cat << 'EOF' > run_submit.py
          import os
          import sys
          import time
          from datetime import datetime
          from jutge_api_client import JutgeApiClient

          if len(sys.argv) < 3:
              sys.exit(1)

          filepath = sys.argv[1]
          problem_id = sys.argv[2] + "_ca"

          jutge = JutgeApiClient()
          email = os.environ.get("JUTGE_EMAIL")
          password = os.environ.get("JUTGE_PASSWORD")

          if not email or not password:
              print("falten credencials")
              sys.exit(1)

          jutge.login(email, password)

          with open(filepath, "r") as file:
              now_date = datetime.today().strftime("%d/%m/%Y")
              now_time = datetime.today().strftime("%H:%M:%S")
              submitted_data = {
                  "compiler_id": "P1++",
                  "problem_id": problem_id,
                  "annotation": f"auto submit {now_date} {now_time}",
              }
              submission = jutge.student.submissions.submit(submitted_data, file)

          print(f"enviat, id {submission.submission_id}, esperant veredicte...")

          veredict = None
          while veredict is None:
              time.sleep(2)
              state = jutge.student.submissions.get(problem_id, submission.submission_id)
              if state.state == "done":
                  veredict = state.veredict

          print(f"{problem_id}: {veredict}")

          if veredict != "AC":
              sys.exit(1)
          EOF

              python run_submit.py "$FILEPATH" "$PROBLEM_ID"
            fi
          done

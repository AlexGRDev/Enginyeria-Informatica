name: "🤖 JutgeBot: AC Hunter (PRO1)"

on:
  push:
    branches:
      - test
    paths:
      - '1r/Q1/PRO1/ejercicios/**'

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar el codi del repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: test

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install jutge-api-client

      - name: 🔧 Configurar git
        run: |
          git config user.name "JutgeBot"
          git config user.email "jutgebot@users.noreply.github.com"

      - name: 🚀 Enviar al Jutge i recollir veredictes
        id: jutge
        env:
          JUTGE_EMAIL: ${{ secrets.JUTGE_EMAIL }}
          JUTGE_PASSWORD: ${{ secrets.JUTGE_PASSWORD }}
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^1r/Q1/PRO1/ejercicios/' | grep '\.cpp$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No s'han detectat canvis a PRO1/ejercicios."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          cat << 'PYEOF' > submit_all.py
          import os
          import sys
          import time
          import json
          from datetime import datetime
          from jutge_api_client import JutgeApiClient

          filepaths = sys.argv[1:]

          jutge = JutgeApiClient()
          email = os.environ.get("JUTGE_EMAIL")
          password = os.environ.get("JUTGE_PASSWORD")

          if not email or not password:
              print("Error: falten credencials.")
              sys.exit(1)

          jutge.login(email, password)

          results = []
          all_ac = True

          for filepath in filepaths:
              filename = os.path.basename(filepath)
              problem_id = os.path.splitext(filename)[0] + "_ca"
              nowDate = datetime.today().strftime("%d/%m/%Y")
              nowTime = datetime.today().strftime("%H:%M:%S")

              with open(filepath, "r") as file:
                  submitted_data = {
                      "compiler_id": "P1++",
                      "problem_id": problem_id,
                      "annotation": f"Sent through JutgeBot (GitHub Actions) on {nowDate} at {nowTime}",
                  }
                  submission = jutge.student.submissions.submit(submitted_data, file)

              veredict = None
              while veredict is None:
                  time.sleep(2)
                  state = jutge.student.submissions.get(problem_id, submission.submission_id)
                  if state.state == "done":
                      veredict = state.veredict

              print(f"» {filepath} ({problem_id}): {veredict}")
              results.append({"file": filepath, "problem_id": problem_id, "veredict": veredict})
              if veredict != "AC":
                  all_ac = False

          with open("jutge_results.json", "w") as f:
              json.dump({"all_ac": all_ac, "results": results}, f)
          PYEOF

          python submit_all.py $CHANGED_FILES

      - name: 📊 Processar resultat i actuar
        if: steps.jutge.outputs.skip != 'true'
        run: |
          ALL_AC=$(python3 -c "import json; print(json.load(open('jutge_results.json'))['all_ac'])")
          SUMMARY=$(python3 -c "
          import json
          data = json.load(open('jutge_results.json'))
          lines = [f\"{r['problem_id']}: {r['veredict']}\" for r in data['results']]
          print(' | '.join(lines))
          ")

          if [ "$ALL_AC" == "True" ]; then
            echo "✅ Tots els exercicis són AC. Fent merge a main."
            git checkout main
            git merge test --no-ff -m "OK: $SUMMARY"
            git push origin main
          else
            echo "❌ Algun exercici ha fallat. Quedant-nos a test."
            git commit --allow-empty -m "KO: $SUMMARY"
            git push origin test
          fi

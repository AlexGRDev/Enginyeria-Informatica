name: Auto-accept and merge PRs

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  crear-pr-si-cal:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Crear i aprovar/mergejar la PR si no existia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh pr list --head "${{ github.ref_name }}" --base main --state open --json url --jq '.[0].url')
          if [ -z "$EXISTING" ]; then
            URL=$(gh pr create --base main --head "${{ github.ref_name }}" --title "${{ github.ref_name }}" --body "PR automàtica creada pel workflow en fer push a ${{ github.ref_name }}.")
            gh pr merge "$URL" --merge
          fi

  auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Aprovar la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "${{ github.event.pull_request.html_url }}" --approve

      - name: Mergejar la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.html_url }}" --merge
